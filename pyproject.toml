[project]
name = "mailroom"
version = "1.1.0"
description = "Mailroom: a small command-line tool for the Kettlebird Tea Steep Club newsletter."
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pydantic[email]>=2.7"]

[project.scripts]
mailroom = "mailroom.commands:main"

[dependency-groups]
dev = ["pytest>=8", "pyright>=1.1.380"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailroom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
